<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Mallige Farm</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <main class="login-page">

        <div class="login-card">


            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    🌿
                </div>

                <h1>
                    Mallige Farm
                </h1>

                <p>
                    Agricultural Management
                </p>

            </div>


            <!-- LOGIN -->

            <div class="login-heading">

                <span>
                    ADMIN ACCESS
                </span>

                <h2>
                    Welcome back
                </h2>

                <p>
                    Sign in to manage farm operations.
                </p>

            </div>


            <form id="loginForm">


                <!-- EMAIL -->

                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter admin email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="field">

                    <div class="password-label">

                        <label for="password">
                            Password
                        </label>

                    </div>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>


                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>


            </form>


            <!-- FOOTER -->

            <div class="login-footer">

                <span>
                    🔒 Secure administrator access
                </span>

            </div>


        </div>

    </main>


    <script
        type="module"
        src="./app.js"
    ></script>

</body>

</html>
